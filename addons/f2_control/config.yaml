name: PHASE Controller
version: "1.3.1"
slug: f2_control
description: >-
  The controller of PHASE Control (Precision Hydration And Steering Engine):
  autonomous crop steering for Home Assistant. Runs the daily P0-P1-P2-P3 dryback
  cycle per zone from your live VWC/EC probes (fusing multiple sensors per zone),
  sequences the pump and valves with valve-close read-back, and is gated by a hard
  kill switch. Configure once in the PHASE Control UI; the operator dashboards are
  served right in the sidebar.
url: https://github.com/Chill-Division/PHASE-Control
arch:
  - amd64
  - aarch64
init: false
boot: auto
startup: application
homeassistant: "2026.5.0"
homeassistant_api: true
hassio_api: false
host_network: false
ingress: true
ingress_port: 8420
panel_icon: mdi:water-circle
panel_title: PHASE Control
options:
  num_zones: 3
  lights_on_hour: 10
  lights_off_hour: 22
  enable_flag: input_boolean.f2_control_enabled
  notify_service: ""
  notify_min: 30
  instance_name: PHASE Control
  hold_entities: []
  substrate_l: 5
  flow_lps: 0.02
  loop_seconds: 60
  rediscover_seconds: 300
schema:
  num_zones: int
  lights_on_hour: float
  lights_off_hour: float
  enable_flag: str
  notify_service: str?
  notify_min: float
  instance_name: str?
  hold_entities:
    - str
  substrate_l: float
  flow_lps: float
  loop_seconds: float
  rediscover_seconds: float
