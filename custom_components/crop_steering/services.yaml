set_manual_override:
  name: Set manual override
  description: >-
    Pause automatic irrigation for one zone until the timeout expires, including
    across Home Assistant restarts. The default is 60 minutes. Disable clears the
    hold immediately; turning the switch on directly creates an indefinite hold.
    Needs a Home Assistant administrator when a signed-in user calls it, directly
    or through a script they start; automations are unaffected.
  fields:
    zone:
      name: Zone
      description: Zone number.
      required: true
      selector:
        number:
          min: 1
          max: 24
          mode: box
    timeout_minutes:
      name: Timeout
      description: Auto-clear after this many minutes; defaults to 60 (max 24 h).
      default: 60
      required: false
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
          mode: box
    enable:
      name: Enable
      description: True to enable the override, false to clear it.
      required: false
      selector:
        boolean:
    room:
      name: Room
      description: Room slug for multi-room installs. Omit for the default room.
      required: false
      selector:
        text:

setup_read:
  name: Read room setup
  description: Return setup capabilities, room configuration and searchable devices. Requires an administrator and a service response.

setup_create:
  name: Add room
  description: Create a room through the Home Assistant config flow, after validating mapping and verified OFF hardware. Does not enable irrigation.
  fields:
    room_name:
      required: true
      selector:
        text:
    zones:
      required: true
      selector:
        object:
    hardware:
      selector:
        object:

setup_save:
  name: Save room setup
  description: Update one room without changing its IDs. All affected engines and mapped hardware must read OFF. Set active true to restore an archived room.
  fields:
    entry_id:
      required: true
      selector:
        text:
    expected_revision:
      required: true
      selector:
        number:
          min: 0
          max: 2147483647
          mode: box
    room_name:
      required: true
      selector:
        text:
    active:
      selector:
        boolean:
    zones:
      required: true
      selector:
        object:
    hardware:
      selector:
        object:

setup_remove:
  name: Archive room
  description: Archive the explicitly selected room after verified OFF checks. Preserves entry IDs, mappings and controller counters for restoration.
  fields:
    entry_id:
      required: true
      selector:
        text:
    expected_revision:
      required: true
      selector:
        number:
          min: 0
          max: 2147483647
          mode: box
    confirm_name:
      required: true
      selector:
        text:

strategy_get:
  name: Read irrigation strategy
  description: Return the room's durable draft, active snapshot, and readable parameter bounds.
  fields:
    room_id:
      name: Room ID
      description: "Canonical room identity: room: for the default or room:f1_ for a named room."
      required: true
      selector:
        text:

strategy_save:
  name: Save irrigation strategy draft
  description: Validate and save grower-defined endpoints and daily or weekly zone assignments. Does not activate watering. Needs a Home Assistant administrator when a signed-in user calls it, directly or through a script they start; automations are unaffected.
  fields:
    room_id:
      required: true
      selector:
        text:
    expected_revision:
      description: Revision returned by strategy_get; rejects stale edits.
      required: true
      selector:
        number:
          min: 0
          mode: box
    plan:
      description: Version 1 strategy with profiles and per-zone schedules.
      required: true
      selector:
        object:

strategy_preview:
  name: Preview irrigation strategy
  description: Interpolate explicit endpoints and calculate hydraulic shot volumes and durations without writes.
  fields:
    room_id:
      required: true
      selector:
        text:
    plan:
      required: false
      selector:
        object:
    date:
      description: Optional local grow-day date, YYYY-MM-DD.
      required: false
      selector:
        text:

strategy_activate:
  name: Arm irrigation strategy
  description: Arm a saved draft for the next local lights-on boundary. Requires a compatible controller and readable configuration; never enables hardware. Needs a Home Assistant administrator when a signed-in user calls it, directly or through a script they start; automations are unaffected.
  fields:
    room_id:
      required: true
      selector:
        text:
    expected_revision:
      required: true
      selector:
        number:
          min: 0
          mode: box

strategy_disarm:
  name: Disarm irrigation strategy
  description: Cancel an unstarted strategy or return an active one to the manual setpoints at the next lights-on boundary. Use the engine control to stop irrigation eligibility. Needs a Home Assistant administrator when a signed-in user calls it, directly or through a script they start; automations are unaffected.
  fields:
    room_id:
      required: true
      selector:
        text:

runs_get:
  name: Read run records
  description: Read this room's recorded run metadata. Does not enable irrigation.
  fields:
    room_id:
      required: true
      selector:
        text:
runs_save:
  name: Save run record
  description: Register a run with current reference metadata, or edit its dates and name while preserving the original reference. Needs a Home Assistant administrator when a signed-in user calls it, directly or through a script they start; automations are unaffected.
  fields:
    room_id:
      required: true
      selector:
        text:
    expected_revision:
      required: true
      selector:
        number:
          min: 0
          mode: box
    record:
      required: true
      selector:
        object:
runs_archive:
  name: Archive or restore run record
  description: Change run visibility without deleting historical reference metadata. Needs a Home Assistant administrator when a signed-in user calls it, directly or through a script they start; automations are unaffected.
  fields:
    room_id:
      required: true
      selector:
        text:
    expected_revision:
      required: true
      selector:
        number:
          min: 0
          mode: box
    id:
      required: true
      selector:
        text:
    archived:
      required: true
      selector:
        boolean:
runs_import:
  name: Import run records
  description: Import at most 100 validated metadata records for the same room. Recorder history is not included. Needs a Home Assistant administrator when a signed-in user calls it, directly or through a script they start; automations are unaffected.
  fields:
    room_id:
      required: true
      selector:
        text:
    expected_revision:
      required: true
      selector:
        number:
          min: 0
          mode: box
    runs:
      required: true
      selector:
        object:
stock_get:
  name: Read stock tanks
  description: Read this room's stock tanks, their levels, what one batch takes from each (from the feed recipe in use), and the batches counted. Does not change anything.
  fields:
    room_id:
      required: true
      selector:
        text:
stock_save:
  name: Save stock tanks
  description: Replace this room's list of stock tanks (name, capacity, level, low mark and the Reservoir doser each is on; what a batch takes from a tank is the feed recipe's). A tank left out is removed. Needs a Home Assistant administrator when a signed-in user calls it, directly or through a script they start; automations are unaffected.
  fields:
    room_id:
      required: true
      selector:
        text:
    expected_revision:
      required: true
      selector:
        number:
          min: 0
          mode: box
    tanks:
      required: true
      selector:
        object:
stock_refill:
  name: Refill a stock tank
  description: Record that a stock tank was refilled to capacity, or set the level read off its side. Needs a Home Assistant administrator when a signed-in user calls it, directly or through a script they start; automations are unaffected.
  fields:
    room_id:
      required: true
      selector:
        text:
    expected_revision:
      required: true
      selector:
        number:
          min: 0
          mode: box
    id:
      required: true
      selector:
        text:
    level_l:
      required: false
      selector:
        number:
          min: 0
          max: 10000
          step: 0.1
          unit_of_measurement: L
          mode: box
feed_get:
  name: Read nutrient batch settings
  description: Read this room's reservoir and doser settings, its feed recipes, the feed stage in use and what the next batch would dose. Does not change anything.
  fields:
    room_id:
      required: true
      selector:
        text:
feed_save:
  name: Save nutrient batch settings
  description: Replace this room's reservoir and doser settings, its feed recipes and the feed stage in use. Needs a Home Assistant administrator when a signed-in user calls it, directly or through a script they start; automations are unaffected.
  fields:
    room_id:
      required: true
      selector:
        text:
    expected_revision:
      required: true
      selector:
        number:
          min: 0
          mode: box
    document:
      required: true
      selector:
        object:
feed_mix:
  name: Mix a nutrient batch now
  description: Ask the controller app for one nutrient batch in this room now, as the room's Mix a Batch Now button does. Refused while the feed plan could not run. Needs a Home Assistant administrator when a signed-in user calls it, directly or through a script they start; automations are unaffected.
  fields:
    room_id:
      required: true
      selector:
        text:
    force:
      name: Run anyway
      description: The fill fits, as checked by a person. The controller then does not refuse this batch for a reservoir too full to take the fill, which it would otherwise do.
      required: false
      default: false
      selector:
        boolean:
test_shot:
  name: Test a zone's watering
  description: Ask the controller app for a 10-second test shot in one zone, as the zone's Test Shot button does, to check that watering works. It passes every check a shot passes except a held irrigation strategy's, and its water counts toward the day's. Needs a Home Assistant administrator when a signed-in user calls it, directly or through a script they start; automations are unaffected.
  fields:
    room_id:
      required: true
      selector:
        text:
    zone:
      required: true
      selector:
        number:
          min: 1
          max: 99
          mode: box
whats_new_get:
  name: Read what's new
  description: The release highlights shipped with this integration, the installed version and the last release the dashboard's What's new window showed. Changes nothing.
whats_new_seen:
  name: Mark what's new as shown
  description: Record that the dashboard's What's new window has shown the highlights up to this version, for the whole installation, so it does not show them again. Changes nothing else.
  fields:
    version:
      required: true
      example: "1.0.0"
      selector:
        text:
whats_new_tour_seen:
  name: Mark the first-run tour as shown
  description: Record that the dashboard's first-run tour has started, for the whole installation, so it does not start by itself again. Help still starts it. Changes nothing else.
